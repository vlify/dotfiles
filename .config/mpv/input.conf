# ========== 基础控制 ==========
SPACE        cycle pause               # 空格键：暂停/播放
MBTN_LEFT_DBL cycle fullscreen          # 双击左键：切换全屏 (社区标准习惯)
MBTN_RIGHT   ignore                    # 右键单击：禁用 (防止误触)
WHEEL_UP     add volume 2              # 滚轮上：音量+2
WHEEL_DOWN   add volume -2             # 滚轮下：音量-2
q            quit                      # q 键：退出
Q            quit-watch-later          # Shift+q：保存进度并退出

# ========== 画面与排障实用功能 ==========
Ctrl+a       cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1" # Ctrl+a：切换画面比例 (修复老片拉伸)
c            ignore                    # c 键禁用 (防止与字幕/Captions习惯误触拉伸变形)
Ctrl+h       cycle-values hwdec "auto-safe" "no" # Ctrl+h：一键切换硬解/软解 (排查罕见视频花屏)
Ctrl+r       cycle-values video-rotate "90" "180" "270" "0" # Ctrl+r：一键旋转视频 (手机竖屏录像)
d            ignore                    # d 键禁用 (现代网络流全为逐行，防误触导致画质劣化与掉帧)

# ========== 方向键导航 ==========
RIGHT        seek 5                    # 右键：快进5秒
LEFT         seek -5                   # 左键：快退5秒
UP           add volume 5              # 上键：音量+5
DOWN         add volume -5             # 下键：音量-5
Shift+RIGHT  seek 60                   # Shift+右键：快进60秒
Shift+LEFT   seek -60                  # Shift+左键：快退60秒
Ctrl+RIGHT   sub-seek 1                # Ctrl+右键：跳到下一个字幕句
Ctrl+LEFT    sub-seek -1               # Ctrl+左键：跳到上一个字幕句

# ========== 播放速度控制 ==========
[            multiply speed 1/1.1      # [ 键：速度-10%
]            multiply speed 1.1        # ] 键：速度+10%
{            multiply speed 0.5        # { 键：速度减半
}            multiply speed 2.0        # } 键：速度加倍
BS           set speed 1.0             # 退格键：重置速度为1.0

# ========== 截图控制 ==========
s            screenshot                # s键：含字幕截图
S            screenshot video          # Shift+s键：纯视频截图
Ctrl+s       screenshot window         # Ctrl+s键：截取当前完整窗口

# ========== 窗口控制 ==========
f            cycle fullscreen          # f键：切换全屏
t            cycle ontop               # t键：切换窗口置顶

# ========== 字幕控制 (经典 v 键流) ==========
v            cycle sub-visibility               # v 键：一键开闭主字幕 (英文原声)
V            cycle secondary-sub-visibility     # Shift+v：一键开闭次字幕 (中文对照)
Ctrl+v       cycle sub                          # Ctrl+v：切换主字幕轨道 (英文)
Ctrl+V       cycle secondary-sid                # Ctrl+Shift+v：切换次字幕轨道 (中文)
Alt+v        cycle sub down                     # Alt+v：反向切换主字幕轨
Alt+V        cycle secondary-sid down           # Alt+Shift+v：反向切换次字幕轨

# ========== ModernZ 与播放列表 ==========
TAB          script-binding modernz/visibility  # Tab键：切换OSC显示模式
F8           script-binding playlistmanager/showplaylist # F8：呼出播放列表管理器

# ========== 第三方插件误触防御 (社区隔离准则) ==========
g            ignore                    # 禁用 SponsorBlock 裸键 (防 Vim gg 误触)
G            ignore                    # 禁用 SponsorBlock 裸键 (防 Vim G 误触)
h            ignore                    # 禁用 SponsorBlock 裸键 (防 Vim h 误触)
H            ignore                    # 禁用 SponsorBlock 裸键

# ========== Anime4K 画质模式热切换 (HQ) ==========
ALT+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A (HQ)"
ALT+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode B (HQ)"
ALT+3 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode C (HQ)"
ALT+4 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A+A (HQ)"
ALT+5 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode B+B (HQ)"
ALT+6 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode C+A (HQ)"

ALT+0 no-osd change-list glsl-shaders clr ""; show-text "GLSL 着色器已清空 (还原纯净画质)"
