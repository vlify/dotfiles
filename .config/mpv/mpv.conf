# ==============================================================================
#                      MPV 核心配置文件 (基于社区主流优化实践)
# ==============================================================================

# ========== 核心渲染与画质 ==========
vo=gpu-next                            # 新一代 GPU 渲染器 (mpv 0.36+ 标配)
gpu-api=auto                           # 自动协商最佳图形 API (Vulkan / OpenGL)
profile=gpu-hq                         # 启用内置高质量图像算法预设

# 硬件解码与色彩管理
hwdec=auto-safe                        # 自动选择最安全高效的硬解模式 (零拷贝，极低功耗)
dither-depth=auto                      # 自动色深抖动 (有效消除色带/色阶断层)
target-colorspace-hint=yes             # 自动向显示器传递色彩空间信息 (Wayland HDR/广色域支持)

# 高级缩放算法 (基于 hooke007 / dyphire 推荐标准)
scale=ewa_lanczos                      # 亮度放大算法 (EWA Lanczos / Jinc, 锐利自然)
scale-antiring=0.7                     # 抑制振铃伪影
cscale=ewa_lanczos                     # 色度放大算法
dscale=mitchell                        # 缩小算法 (Mitchell 柔和不失真)

# 显示同步与平滑运动 (消除 24fps 视频在 60Hz/144Hz 屏幕上的抖动)
video-sync=display-resample            # 重采样音频以完全匹配显示器刷新率
interpolation=yes                      # 启用帧时间平滑插值
tscale=oversample                      # 时间轴插值算法

# ========== 播放控制与记忆 ==========
keep-open=always                       # 播完后停在最后一帧，不自动退出
save-position-on-quit=yes              # 退出时记住播放进度 (下次打开自动续播)
autofit-larger=85%x85%                 # 初始窗口大小不超过屏幕 85%
fs=no                                  # 默认不全屏 (按 f 随时切换全屏)
volume=100                             # 默认音量
volume-max=150                         # 最大增益音量 150%

# ========== 界面与 ModernZ 配合 ==========
osc=no                                 # 禁用原生粗糙控制条 (使用 scripts/modernz.lua)
osd-bar=no                             # 禁用原生 OSD 进度条 (由 modernz 统一接管)
border=no                              # 无系统边框 (极简沉浸式)
cursor-autohide=1000                   # 鼠标静止 1 秒后自动隐藏

# ========== OSD 提示与中文字体 ==========
osd-font='Noto Sans CJK SC'            # OSD 提示中文字体 (解决中文不显示/方块问题)
osd-font-size=34                       # OSD 提示字号
osd-color='#FFFFFFFF'                  # 白色文本
osd-border-size=2.2                    # 黑色描边
osd-border-color='#FF000000'
osd-shadow-offset=1.2                  # 阴影
osd-shadow-color='#80000000'

# ========== 音频配置 ==========
audio-file-auto=fuzzy                  # 模糊匹配同目录下外挂音轨
audio-channels=stereo                  # 双声道降混
audio-normalize-downmix=yes            # 多声道降混时音量正规化 (防止对白声音过小)
alang=ja,jpn,zh,chi,en,eng             # 音轨语言优先级：日 > 中 > 英

# ========== 字幕渲染与双字幕堆叠 (英主在上，中辅在下，紧密咬合) ==========
sub-auto=fuzzy                         # 模糊匹配同目录下外挂字幕
slang=en,eng,ja,jpn,zh,chi,chs,cht     # 主字幕语言优先级：英 > 日 > 中 (英文为主字)
sub-font='Noto Sans CJK SC'            # 高清中文字体
sub-font-size=36                       # 主字幕(英文)基准字号，适度缩小更精致防溢出
sub-color='#FFFFFFFF'                  # 白色主字幕
sub-border-size=2.2                    # 黑色清晰适中描边
sub-border-color='#FF000000'
sub-shadow-offset=1.2                  # 柔和阴影提升对比度
sub-shadow-color='#70000000'
sub-pos=84                             # 主字幕(英文)上移至 84%，留足垂直呼吸间距

# 双字幕 / 次字幕支持 (中文辅助字幕置于底部，主次分明不重叠)
secondary-sid=auto                     # 自动检测次字幕
secondary-sub-ass-override=no          # 关键: 禁止剥离次字幕的 ASS 动效与 \move 坐标 (保证弹幕兼容)
secondary-sub-visibility=yes
secondary-sub-pos=97                   # 次字幕(中文)置于 97%，与上方英文拉开安全距离，杜绝重叠碰撞

# ========== 字幕时序平滑与刷新防闪烁 (核心优化) ==========
sub-fix-timing=yes                     # 开启字幕时序修复，消除换句微小空白闪烁与间隙
sub-fix-timing-threshold=250           # 250ms 内的微小间隙自动平滑衔接，避免频繁灭屏

# ========== 截图配置 ==========
screenshot-format=webp                 # 截图格式 (webp 高清且体积小，或设为 png)
screenshot-webp-lossless=yes           # 无损 webp 截图
screenshot-directory=~/Pictures/mpv/   # 截图保存路径
screenshot-template="%F-%P"            # 命名格式: 视频文件名-时间戳

# ========== 网络流与直播画质优化 ==========
ytdl-format="bestvideo+bestaudio/best" # 强制拉取最高画质流 (避免降级到低码率/720p)
ytdl-raw-options=js-runtimes=node      # 启用 Node.js 运行时解决 YouTube 等站点的 JS 挑战算法
ytdl-raw-options-append=write-subs=    # 自动拉取官方原生字幕
ytdl-raw-options-append=write-auto-subs= # 自动拉取 YouTube AI 机器翻译字幕
ytdl-raw-options-append=sub-langs=en.*,ja.*,zh-Hans,zh # 抓取英/日与中文翻译流
ytdl-raw-options-append=convert-subs=srt # 关键：强制转为 SRT 格式，自动消除 YouTube 逐词滚动(Rolling)机制，还原为完整静态整句！
demuxer-max-bytes=200MiB               # 增加网络流缓冲区 (防止直播丢包卡顿)
demuxer-max-back-bytes=50MiB
demuxer-lavf-o=live_start_index=-1     # 直播低延迟定位首帧
msg-level=ffmpeg=error                  # 过滤 B站 CDN 误标 deflate 产生的底层刷屏警告 (消除终端 I/O 阻塞)

# ==============================================================================
#                     条件自动化预设 (Auto-Profiles / 动态调优)
# ==============================================================================

# 1. 针对 4K / 超高清视频 (>= 2160p): 原生像素足够精细，自动关闭插值与重型放大算法
[profile-4k]
profile-desc=4K超高清视频降载
profile-cond=((width or 0) >= 3840 or (height or 0) >= 2160)
interpolation=no
scale=bilinear
cscale=bilinear
dscale=mitchell
glsl-shaders-clr

# 2. 针对高帧率视频 (>= 50fps): 画面本身已足够流畅，自动关闭插帧
[profile-high-fps]
profile-desc=高帧率视频自动关闭插帧
profile-cond=(p["estimated-vf-fps"] or 0) >= 50
interpolation=no

# 3. 针对网络在线视频 (B站/YouTube/直播流): 强化标题显示与连接超时
[protocol.http]
profile-desc=网络流媒体增强
network-timeout=15
force-window=immediate
title="${media-title:${filename}}"

[protocol.https]
profile-desc=网络流媒体增强
profile=protocol.http

# 4. 针对 B 站域名单独挂载 Qutebrowser 的 cookies (解锁 1080P/大会员原画)，彻底隔离 YouTube 免受风控
[profile-bilibili]
profile-desc=B站专用画质解锁
profile-cond=path and (path:find('bilibili%.com') ~= nil or path:find('b23%.tv') ~= nil)
ytdl-raw-options-append=cookies-from-browser=chromium:/home/ent/.local/share/qutebrowser/webengine
ytdl-raw-options-append=sub-langs=ai-zh,zh-CN,zh.*,en.*
